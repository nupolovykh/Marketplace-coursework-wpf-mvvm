name: Security audit

# Deliberately NOT part of CI.
#
# A vulnerability audit answers a question about the global advisory database,
# not about the commit under test. A newly published advisory turns every open
# pull request red at once — including the very bump that fixes it — and in a
# repository where green CI is what merges updates, that stops the updates from
# landing exactly when they matter most. Here it reports on a schedule and
# blocks nothing.
#
# It is also the one workflow that speaks about `main` itself. Dependabot's
# security updates ignore `target-branch` and never enter the `deps` flow, so
# this report is the only place the whole picture is written down.

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

# GITHUB_TOKEN is enough here: the only thing this writes is the report issue.
permissions:
  contents: read
  issues: write

jobs:
  nuget:
    name: nuget audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      # The WPF projects target net6.0-windows and cannot restore on Linux, so
      # the audit runs over the projects that can. Their package graph is where
      # the third-party surface actually lives; the WPF layer adds views.
      - name: Restore the portable projects
        run: |
          for proj in Marketplace.Domain Marketplace.EntityFramework \
                      Marketplace.Playground Marketplace.SmokeTest; do
            dotnet restore "$proj" || exit 1
          done

      # `dotnet list package --vulnerable` reports findings on stdout and still
      # exits 0, so the verdict has to come from reading its output.
      - name: Audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Explicit: the step's shell is `bash -e`, and this script handles its
          # own failures rather than dying at the first one.
          set +e
          set -uo pipefail

          report=$(for proj in Marketplace.Domain Marketplace.EntityFramework \
                               Marketplace.Playground Marketplace.SmokeTest; do
            dotnet list "$proj" package --vulnerable --include-transitive
          done)

          echo "$report"

          affected=$(grep -ciE '^\s*>' <<<"$report")

          # The finding is an issue, not a failed run: this workflow runs on a
          # schedule against the default branch, so a failure would pin a red
          # check to whatever commit that branch points at — permanently, since a
          # check run cannot be deleted and the mark outlives the fix.
          marker="<!-- vulnerable-dependencies -->"
          # The marker is matched inside jq, against the body as one value. Reading
          # the listing line by line does not work: an issue body is multi-line, the
          # marker sits on a line of its own, and the first field of *that* line is
          # the marker itself rather than a number — which then goes into the request
          # path and comes back 404. That is what made this step fail.
          issue=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
            --jq ".[] | select(.pull_request | not) | select((.body // \"\") | contains(\"$marker\")) | .number" \
            2>/dev/null | head -1)

          if [ "$affected" -gt 0 ]; then
            detail="${affected} package reference(s) carry an advisory."
            body="${detail}

          \`\`\`
          $(grep -E '^\s*(>|Project)' <<<"$report")
          \`\`\`

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          ${marker}"
            if [ -n "$issue" ]; then
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/${issue}" -f "body=${body}" >/dev/null \
                && { echo "::warning::${detail} Updated issue #${issue}."; exit 0; }
            else
              issue=$(gh api "repos/$GITHUB_REPOSITORY/issues" -f "title=Vulnerable dependencies" \
                -f "body=${body}" --jq '.number' 2>/dev/null) \
                && { echo "::warning::${detail} Opened issue #${issue}."; exit 0; }
            fi
            echo "::error::${detail} The report could not be filed, so this run fails instead."
            exit 1
          fi

          echo "No vulnerable packages reported."
          if [ -n "$issue" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/${issue}" \
              -f state=closed -f state_reason=completed >/dev/null 2>&1 || true
            echo "Nothing left to report; closed issue #${issue}."
          fi
