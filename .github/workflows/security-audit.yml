name: Security audit

# Deliberately NOT part of CI.
#
# A vulnerability audit answers a question about the global advisory database,
# not about the commit under test. A newly published advisory turns every open
# pull request red at once — including the very bump that fixes it — and in a
# repository where green CI is what merges updates, that stops the updates from
# landing exactly when they matter most. Here it reports on a schedule and
# blocks nothing.
#
# It is also the one workflow that speaks about `main` itself: Dependabot's
# security updates are switched off in this repository, so this report is the
# only place the whole picture is written down. For NuGet it is also the only
# place transitive advisories show up at all — without a lock file the
# dependency graph lists direct packages only.
#
# The report is the run's summary and its warnings, not an issue. An issue stays
# open until every advisory is fixed, which for coursework may be never, and it
# is one more thing a human has to close. The summary is on the Actions tab of
# every run, and a finding never fails the run.

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nuget:
    name: nuget audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      # The WPF projects target net6.0-windows and cannot restore on Linux, so
      # the audit runs over the projects that can. Their package graph is where
      # the third-party surface actually lives; the WPF layer adds views.
      - name: Restore the portable projects
        run: |
          for proj in Marketplace.Domain Marketplace.EntityFramework \
                      Marketplace.Playground Marketplace.SmokeTest; do
            dotnet restore "$proj" || exit 1
          done

      # `dotnet list package --vulnerable` reports findings on stdout and still
      # exits 0, so the verdict has to come from reading its output.
      - name: Audit
        run: |
          # Explicit: the step's shell is `bash -e`, and this script handles its
          # own failures rather than dying at the first one.
          set +e
          set -uo pipefail

          report=$(for proj in Marketplace.Domain Marketplace.EntityFramework \
                               Marketplace.Playground Marketplace.SmokeTest; do
            dotnet list "$proj" package --vulnerable --include-transitive
          done)

          echo "$report"

          affected=$(grep -ciE '^\s*>' <<<"$report")

          # A finding never fails the run: this workflow runs on a schedule
          # against the default branch, so a failure would pin a red check to
          # whatever commit that branch points at — permanently, since a check run
          # cannot be deleted and the mark outlives the fix.
          if [ "$affected" -gt 0 ]; then
            detail="${affected} package reference(s) carry an advisory."
            echo "::warning::${detail}"
          else
            detail="No vulnerable packages reported."
          fi
          echo "$detail"

          {
            echo "### Security audit"
            echo
            echo "${detail}"
            if [ "$affected" -gt 0 ]; then
              echo
              echo '```'
              grep -E '^\s*(>|Project)' <<<"$report"
              echo '```'
            fi
          } >>"$GITHUB_STEP_SUMMARY"
